<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>ANNIE Portfolio — 桌面版</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
#stage{position:relative;width:100%;height:100%;overflow:hidden;background:#000}
#canvas{position:absolute;left:0;top:0;width:1440px;transform-origin:top left}
iframe{display:block;width:1440px;border:0;background:#fff}
</style>
</head>
<body>
<div id="stage"><div id="canvas"><iframe id="site" title="ANNIE Portfolio 桌面版" src="/?v=desktop-fixed-20261025"></iframe></div></div>
<script>
(function(){
 const canvas=document.getElementById('canvas');
 const frame=document.getElementById('site');
 function fit(){
  const scale=Math.min(1,innerWidth/1440);
  canvas.style.left=Math.max(0,(innerWidth-1440*scale)/2)+'px';
  canvas.style.transform='scale('+scale+')';
  frame.style.height=Math.ceil(innerHeight/scale)+'px';
 }
 addEventListener('resize',fit,{passive:true}); fit();
})();
</script>
</body>
</html>
